<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tennis League — Results</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style id="css">:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#10283d; --bg2:#0a1c2c; --head:#10283d; --panel:#f4f0e4; --row:#ffffff; --row2:#ece8db;
  --ink:#10283d; --cream:#f6f1e3; --acc:#cfe93f; --acc-ink:#10283d; --acc2:#ff7f50;
  --muted:#7d8479; --line:#d9d3bf;
  --win:#1f6f3d; --winbg:#dcf0c8; --loss:#a93a2b; --lossbg:#f7dcd5;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
}
:root[data-theme="women"]{
  --bg:#5b1e4b; --bg2:#3c0f31; --head:#3f0f33; --panel:#fbf0e6; --row:#fffaf5; --row2:#f5e6da;
  --ink:#3f0f33; --cream:#fdf3ea; --acc:#f5c343; --acc-ink:#3f0f33; --acc2:#27b898;
  --muted:#8f7683; --line:#e8d3c2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg2);color:var(--cream);font-family:var(--font);
  -webkit-font-smoothing:antialiased;transition:background .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.wrap{padding:10px}
.frame{position:relative;overflow:hidden;max-width:1080px;margin:0 auto;background:var(--bg);
  border:6px solid #fbf6ea;border-radius:26px;padding:26px 22px 22px;transition:background .3s}
.deco{position:absolute;color:#fff;opacity:.05;pointer-events:none}
.deco.d1{width:340px;right:-70px;top:-40px;transform:rotate(28deg)}
.deco.d2{width:300px;left:-90px;bottom:60px;transform:rotate(-24deg)}
.frame>*:not(.deco){position:relative}

/* header */
.head{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,30px);text-align:center}
.head .racket{width:clamp(26px,5vw,44px);color:var(--acc);flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.head .racket.flip{transform:scaleX(-1)}
.kicker{margin:0;font-size:clamp(10px,2.2vw,13px);font-weight:700;letter-spacing:.32em;color:var(--acc);text-transform:uppercase}
.title{margin:2px 0 0;font-size:clamp(30px,7.4vw,56px);line-height:1.05;font-weight:800;letter-spacing:.01em;text-transform:uppercase;color:var(--cream)}
.title span{color:var(--acc)}
.sub{margin:6px 0 0;font-size:clamp(11px,2.6vw,14px);font-weight:400;color:rgba(246,241,227,.72)}

/* nav */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:20px 0 4px}
.tabs{display:inline-flex;background:rgba(0,0,0,.24);border-radius:999px;padding:4px;gap:2px;max-width:100%}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;color:rgba(246,241,227,.78);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);font-weight:700}
.tab:not([aria-selected="true"]):hover{color:#fff}
.ghost{border:2px solid rgba(246,241,227,.35);background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;font-size:13px;color:var(--cream)}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
.banner{margin:12px auto 0;max-width:560px;text-align:center;font-size:13px;font-weight:500;color:var(--acc-ink);background:var(--acc);border-radius:12px;padding:8px 14px}

/* cards */
.tools{display:flex;justify-content:flex-end;margin:14px 4px -6px}
.seg{display:inline-flex;background:rgba(0,0,0,.24);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;color:rgba(246,241,227,.75)}
.seg button[aria-pressed="true"]{background:rgba(246,241,227,.92);color:var(--ink)}
.card{background:var(--panel);color:var(--ink);border-radius:24px;padding:16px 14px 10px;margin:20px 0 0;box-shadow:0 7px 0 var(--bg2)}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 4px 6px}
.tag{margin:0;display:inline-block;background:var(--acc);color:var(--acc-ink);font-size:clamp(17px,4vw,22px);font-weight:800;padding:6px 22px;border-radius:999px;box-shadow:0 4px 0 var(--bg2)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);opacity:.8}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.pill.final{opacity:1;background:var(--ink);color:var(--acc);padding:5px 12px;border-radius:999px;font-weight:700}
.pill.final i{background:var(--acc)}

.scroll{overflow-x:auto;padding:0 2px 2px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:700px}
th{background:var(--head);color:#fff;font-size:11px;font-weight:700;letter-spacing:.07em;padding:10px 6px;text-align:center;line-height:1.15}
th.l{text-align:left;padding-left:16px;border-radius:12px 0 0 12px;position:sticky;left:0;z-index:2;background:var(--head)}
th.a2{color:var(--acc2)}
th.pos{background:var(--acc);color:var(--acc-ink);border-radius:0 12px 12px 0;position:sticky;right:0;z-index:2}
td{background:var(--row);padding:5px 4px;text-align:center;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr:nth-child(even) td{background:var(--row2)}
td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
td.m,td.wl,td.gm{border-left:1px dashed var(--line)}
td.pos{background:var(--acc)!important;border:0;border-radius:0 12px 12px 0;font-weight:800;font-size:22px;color:var(--acc-ink);width:64px;line-height:1;position:sticky;right:0;z-index:1}
td.pos small{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;margin-top:3px;opacity:.7}
td.pl{position:sticky;left:0;z-index:1;text-align:left;padding-left:12px;white-space:nowrap;min-width:196px}
tbody tr:nth-child(even) td.pl{background:var(--row2)}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--head);color:#fff;font-size:10px;font-weight:700;margin-right:8px;vertical-align:middle}
.pname{font-size:14px;font-weight:700;vertical-align:middle}
td.m{width:104px}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:46px;border:0;border-radius:10px;padding:4px 2px;background:transparent;line-height:1.15}
.mc b{font-size:15px;font-weight:700}
.mc span{font-size:10px;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc.win{background:var(--winbg);color:var(--win)}
.mc.loss{background:var(--lossbg);color:var(--loss)}
.mc.pend{color:var(--muted)}
.mc:hover{box-shadow:inset 0 0 0 2px var(--head)}
td.wl{font-weight:800;font-size:16px;width:70px}
td.gm{width:96px;font-weight:700;font-size:15px;white-space:nowrap}
td.gm i{font-style:normal;color:var(--acc2);font-weight:800;margin:0 4px}
.dim{color:var(--muted)}

.foot{margin:18px 6px 2px;text-align:center;font-size:12px;line-height:1.7;color:rgba(246,241,227,.65)}
.swipe{display:none;margin:0 6px 4px;font-size:11px;font-weight:500;color:var(--muted)}
.foot b{color:rgba(246,241,227,.9);font-weight:600}
.foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin:0 8px;vertical-align:middle}

/* schedule */
.filter{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;flex-wrap:wrap;font-size:13px;font-weight:500}
.filter select{background:rgba(0,0,0,.28);border:2px solid rgba(246,241,227,.3);border-radius:999px;padding:8px 14px;color:var(--cream);font-weight:600;max-width:100%}
.filter select option,.filter select optgroup{color:#10283d;background:#fff}
.round{display:grid;grid-template-columns:118px 1fr;gap:12px;background:var(--panel);color:var(--ink);border-radius:20px;padding:10px;margin-top:14px;box-shadow:0 6px 0 var(--bg2)}
.rt{background:var(--head);color:#fff;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.rt small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2)}
.rt strong{font-size:26px;line-height:1;font-weight:800;color:var(--acc)}
.rt em{font-style:normal;font-size:13px;font-weight:600}
.rt .next{margin-top:6px;background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px}
.courts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{border:1px solid var(--line);background:var(--row);border-radius:14px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.mt:hover{box-shadow:inset 0 0 0 2px var(--head)}
.mt-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.chip{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.men{background:#10283d;color:#cfe93f}
.chip.women{background:#5b1e4b;color:#f5c343}
.pl2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:500;line-height:1.3}
.pl2 .sc{font-weight:800;font-variant-numeric:tabular-nums}
.pl2.w{font-weight:800}
.pl2.w .sc{color:var(--win)}
.pl2.l{color:#5f665c}
.vs{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.empty{margin:18px 6px;text-align:center;color:rgba(246,241,227,.75);font-size:14px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,14,22,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--panel);color:var(--ink);border-radius:24px;padding:22px 22px 18px;width:100%;max-width:400px;box-shadow:0 8px 0 var(--bg2);max-height:100%;overflow:auto}
.dlg h3{margin:8px 0 2px;font-size:20px;font-weight:800}
.dmeta{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.dl-row{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;margin-top:12px}
.dl-row label,.dl-row .nm{font-size:15px;font-weight:700}
.dl-row input{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:center;font-size:24px;font-weight:800;color:var(--ink)}
.dl-row input:focus{border-color:var(--head);outline:none}
.dl-row .big{font-size:26px;font-weight:800;text-align:center}
.dl-row.w .nm{color:var(--win)}
.hint{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.err{color:var(--loss);font-size:13px;font-weight:600;margin:10px 0 0;min-height:1em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;background:var(--head);color:#fff}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:0 3px 0 var(--bg2)}
.btn.txt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.dng{background:transparent;color:var(--loss);border:2px solid var(--lossbg)}
.btn[disabled]{opacity:.55;cursor:default}
.qr{width:min(260px,70vw);margin:14px auto 8px;padding:10px;background:#fff;border-radius:16px;display:block}
.qr svg{display:block;width:100%;height:auto}
.dlg input.url{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fbf6ea;color:#10283d;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:60}

@media (max-width:760px){
  .wrap{padding:6px}
  .frame{padding:18px 8px 14px;border-width:5px;border-radius:22px}
  .card{padding:12px 6px 6px}
  .card-head{margin:0 4px 4px}
  .scroll{padding:0}
  table{min-width:0;border-spacing:0 4px}
  th{font-size:8.5px;padding:8px 1px;letter-spacing:.02em}
  th.l{padding-left:8px}
  td{padding:3px 1px}
  td.pl{min-width:0;width:88px;white-space:normal;padding-left:7px;line-height:1.1}
  .num{display:none}
  .pname{display:block}
  .pname .fn{display:block;font-size:9.5px;font-weight:500;color:var(--muted)}
  .pname .ln{font-size:11.5px;font-weight:800;letter-spacing:-.01em}
  td.m{width:35px}
  .mc{min-height:34px;padding:2px 0;border-radius:7px}
  .mc b{font-size:11px}
  .mc span{display:none}
  td.wl{font-size:12px;width:30px}
  td.gm{font-size:10.5px;width:44px}
  td.gm i{margin:0 1px}
  td.pos{font-size:17px;width:28px}
  td.pos small{display:none}
  .round{grid-template-columns:1fr}
  .rt{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px}
  .rt strong{font-size:20px}
  .rt .next{margin:0 0 auto auto}
  .courts{grid-template-columns:1fr}
  .tabs{width:100%}
  .tab{flex:1;padding:9px 6px;font-size:13px}
  .swipe{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.dl-row input[type=number]{-moz-appearance:textfield;appearance:textfield}
.dl-row input::-webkit-outer-spin-button,.dl-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.bacts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.bacts button{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px;background:var(--acc-ink);color:var(--acc)}
.bacts button:last-child{background:transparent;color:var(--acc-ink);border:2px solid var(--acc-ink)}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;font-size:12px;font-weight:600;color:rgba(246,241,227,.8);text-align:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#9aa7a0;flex:none}
.sync.ok i{background:#5fe08a;box-shadow:0 0 0 3px rgba(95,224,138,.25)}
.sync.bad{color:#ffb4a3}.sync.bad i{background:#ff7a5c}

.gh{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dlg{max-height:calc(100vh - 32px)}
.dlg.wide{max-width:660px}
.rules h4{margin:18px 0 6px;font-size:15px;font-weight:800;color:var(--ink);padding-bottom:4px;border-bottom:2px solid var(--acc)}
.rules ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}
.rules li{margin:3px 0}
.rules .ex{margin-top:14px;background:var(--row);border:1px solid var(--line);border-left:5px solid var(--acc2);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55}

.scrim{padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.dlg{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden;max-height:100%}
.dbody{overflow-y:auto;padding:22px 22px 18px;-webkit-overflow-scrolling:touch}
.dbody>.dmeta,.dbody>h3{padding-right:38px}
.x{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--head);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.x:hover{background:var(--acc2)}

.rules ol{margin:0;padding-left:22px;font-size:13.5px;line-height:1.55}
.rules ol li{margin:4px 0;padding-left:2px}
.rules ol li::marker{font-weight:800;color:var(--acc2)}
.rules .lead{margin:0 0 4px;font-size:13.5px;font-weight:600}
.rules ul+ul,.rules ol+ul{margin-top:8px}
.hist{min-width:0}.hist td.pl{min-width:0;white-space:normal}.hist td.gm,.hist td.wl{white-space:nowrap}
.hl{display:block;width:100%;text-align:left;border:0;margin:20px 0 0;background:var(--panel);color:var(--ink);border-radius:20px;padding:14px 18px;box-shadow:0 6px 0 var(--bg2);font-family:inherit}
.hl b{font-size:18px;font-weight:800}.hl em{float:right;font-style:normal;font-weight:700;font-size:13px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:3px 12px}
.hl span{display:block;font-size:12px;opacity:.75;margin-top:4px}.hl .hc{opacity:1;font-size:13px;margin-top:8px}
.hp{display:block;font-size:10.5px;font-weight:500;opacity:.65;margin:3px 0 0 0;line-height:1.35}
.hl .hw{opacity:1;margin-top:12px;display:block;border-top:1px solid var(--line)}
.hl .hr{display:flex;flex-direction:column;gap:1px;opacity:1;margin:0;padding:9px 0;border-bottom:1px dashed var(--line);font-size:inherit}.hl .hr:last-child{border-bottom:0}
.hl .hr .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2)}
.hl .hr strong{font-size:17px;font-weight:800}.hl .hr .r{font-size:12px;opacity:.7}
.hl .tap{font-size:11px;font-weight:700;text-align:right;opacity:.55;margin-top:2px}
.pp{border-top:1px solid var(--line);padding:0 2px 8px}
.pp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;cursor:pointer}.pp summary::-webkit-details-marker{display:none}
.pp .pr{font-size:12px;font-weight:700;color:var(--acc2);white-space:nowrap}
.ph{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.65;margin:4px 4px 5px}
.pm{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 10px;margin-bottom:3px;border-radius:10px;background:var(--row);font-size:13px;font-weight:600}
.pm span:first-child{font-size:11px;opacity:.55}.pm b.w{color:#1f7a3d}.pm b.l{color:#b4432c}
.bw{margin:10px 8px 0;font-size:12px;font-weight:600;line-height:1.5}
.rest{margin:8px 4px 0;font-size:12px;font-weight:600;opacity:.85;text-align:center}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1 0 auto}
.gh2{margin:12px 4px 4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2)}
.seat{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;padding:9px 12px;margin-bottom:4px;border-radius:12px;background:var(--row);font-weight:700;font-size:14px}
.seat span:first-child{font-size:11px;opacity:.55}.seat.open{background:transparent;border:2px dashed var(--line);font-weight:600;color:var(--muted);padding:7px 10px}
.sc{border-top:1px solid var(--line);padding:10px 0}.scr{display:flex;gap:10px;align-items:center;font-size:15px;margin:4px 0}.scr small{font-size:11.5px;opacity:.7;font-weight:500}
.sf{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}.sf label{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sf input,.sf select{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink);font:inherit;font-size:14px;min-width:0}.sf input[list]{flex:1;min-width:140px}
.cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc2)}.sumr{font-size:12.5px;font-weight:700;margin:10px 0 2px;color:var(--acc2)}
.pr2{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--row);border-radius:10px;margin-bottom:3px;font-size:14px;font-weight:600}.pr2 small{opacity:.55;margin-left:8px;font-size:11px}
.rm{border:0;background:transparent;font-size:22px;line-height:1;color:var(--loss);padding:0 6px}
.warn{background:#fff3cd;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;margin:6px 0}.warn button{margin:6px 6px 0 0;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;color:var(--ink)}

/* ---------- Modals ---------- */
const rulesHtml = () => `
<p class="dmeta">Tournament rules</p><h3 id="dt">Format &amp; rules</h3>
<div class="rules">
<h4>Tournament format</h4>
<ul>
<li>Played on the first Saturday of the month. Group stage, round robin, 3 courts.</li>
<li>Men\u2019s, Women\u2019s and Mixed categories, Category A and Category B. The groups playing that day are listed in the standings. A category with more players is split into several groups.</li>
<li>Format per category: <b>singles</b>, <b>doubles</b> (fixed pairs) or <b>Americano</b> (partners change every round). Groups have 4 to 7 players or pairs.</li>
<li>Everyone plays everyone else in the group once. In groups of 5 or 7, one player or pair rests in every round and everyone rests the same number of times. P1, P2\u2026 are the draw numbers.</li>
${restNote()}
<li>1st place in each group is the winner.</li>
</ul>
<h4>Match format</h4>
<ul>
<li><b>First to 4 games</b> (4\u20130, 4\u20131, 4\u20132 or 4\u20133). No tie\u2011breaks.</li>
<li><b>Full set:</b> first to 6 games with a 2\u2011game lead (6\u20130 to 6\u20134, or 7\u20135). At 6\u20136 a tie\u2011break gives 7\u20136.</li>
<li>Which one applies is set per category and shown in the Players tab. Smaller groups usually play a full set.</li>
<li><b>Americano:</b> partners change every round. Games won count for each player individually, and the ranking is by total games won.</li>
<li><b>Golden point</b> at 40\u201340 (deuce): no advantage. The next point wins the game, and the receiver chooses which side to receive on.</li>
<li>Report your final score to the organizer straight after the match.</li>
</ul>
<h4>Basic rules</h4>
<ul>
<li><b>Scoring a game:</b> 0 (love), 15, 30, 40, game. At 40\u201340 play the golden point.</li>
<li><b>Serve:</b> the server has two serves and alternates every game. A serve that clips the net and lands in the right box is a let: replay the serve.</li>
<li><b>Ball in or out:</b> a ball touching the line is in. You make the calls on your side of the net. If you are not sure, the ball is good.</li>
<li><b>Point lost</b> if the ball bounces twice, you hit it before it crosses the net, you touch the net, or you hit the ball twice.</li>
<li><b>Ball from another court:</b> if a ball lands on your court during a point, call \u201clet\u201d. The point is replayed and the server has 2 serves.</li>
<li><b>Change ends</b> after every odd game (1st, 3rd, 5th). The server says the score out loud before each point, their own score first.</li>
<li><b>Fair play:</b> stay quiet during points and shake hands at the end. If the organizer cannot see where the ball landed and the two players do not agree, the point is replayed.</li>
</ul>
<h4>How positions are decided</h4>
<p class="lead">Positions are decided in this order:</p>
<ol>
<li><b>Number of wins</b> (W\u2011L): more wins rank higher.</li>
<li><b>Head\u2011to\u2011head:</b> if two players are tied on wins, the winner of the match between them ranks higher.</li>
<li><b>Games differential</b> (GW\u2011GL, games won minus games lost): if three or more players are tied on wins, the best differential ranks higher. Head\u2011to\u2011head is not used in that case.</li>
</ol>
<ul>
<li>The POS column shows <b>H2H</b> or <b>GD</b> under the number when a tie\u2011break decided the position.</li>
<li>If players are still level after the tie\u2011breaks, the organizers decide.</li>
</ul>
<div class="ex"><b>Example:</b> Player 2 and Player 3 both finish with 2 wins and 2 losses, so they are tied for 2nd. It is a two\u2011player tie, so head\u2011to\u2011head decides. If Player 2 beat Player 3, Player 2 takes 2nd and Player 3 takes 3rd, even if Player 3 has the better games differential (for example +5 against +4).<br><br>If Players 2, 3 and 4 all finish on 2 wins, it is a three\u2011player tie. Then only the games differential counts, so the player with the best GW\u2011GL takes 2nd.</div>
</div>
<div class="acts"><button class="btn pri" data-act="close">Got it</button></div>`;

async function persist(next, matchId) {
  // Writes one match to the shared database, then shows it immediately.
  S.busy = true; renderModal();
  try {
    const url = `${RESULTS_URL}/${encodeURIComponent(matchId)}.json`;
    const res = next.results[matchId]
      ? await fetch(url, { method: 'PUT', body: JSON.stringify(next.results[matchId]) })
      : await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    S.data = next; S.busy = false; S.modal = null;
    S.sync = { status: 'live', at: clock() };
    renderModal(); render(); toast('Saved \u2014 standings updated for everyone');
  } catch (e) {
    S.busy = false;
    if (S.modal) S.modal.error = 'Could not save. Check your connection and press Save again.';
    renderModal();
  }
}

const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

async function pollResults() {
  if (document.hidden || S.busy || S.modal) return;
  try {
    const res = await fetch(RESULTS_URL + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = (await res.json()) || {};
    const clean = {};
    Object.keys(remote).forEach(k => { const v = remote[k]; if (Array.isArray(v) && Number.isInteger(v[0]) && Number.isInteger(v[1])) clean[k] = v; });
    const changed = JSON.stringify(clean) !== JSON.stringify(S.data.results) || S.sync.status !== 'live';
    S.data = { ...S.data, results: clean };
    S.sync = { status: 'live', at: clock() }; S.fails = 0;
    if (changed) render(); else { const el = document.querySelector('.sync'); if (el) el.outerHTML = syncBar(); }
  } catch (e) {
    S.fails = (S.fails || 0) + 1;
    if (S.fails < 2) return; // ignore a single blip
    S.sync = { status: 'offline', at: S.sync.at };
    const el = document.querySelector('.sync'); if (el) el.outerHTML = syncBar();
  }
}

function saveScore() {
  const m = matchById(S.modal.id);
  const a = document.getElementById('sa').value.trim(), b = document.getElementById('sb').value.trim();
  const fail = t => { S.modal.error = t; renderModal(); const el = document.getElementById('sa'); };
  if (a === '' || b === '') return fail('Enter games won for both players.');
  const na = Number(a), nb = Number(b);
  const hi = Math.max(na, nb), lo = Math.min(na, nb);
  const sc = CAT_BY_KEY[m.cat].scoring;
  if (!validScore(sc, na, nb)) return fail(sc === 'set' ? 'Full set: valid scores are 6\u20130 to 6\u20134, 7\u20135 or 7\u20136.' : 'The match is first to 4 games. Valid scores: 4\u20130, 4\u20131, 4\u20132 or 4\u20133.');
  persist({ ...S.data, results: { ...S.data.results, [m.id]: [na, nb] } }, m.id);
}

function clearScore() {
  const res = { ...S.data.results }; delete res[S.modal.id];
  persist({ ...S.data, results: res }, S.modal.id);
}

function saveUrl() {

function downloadFile() {
  const blob = new Blob([buildDoc(S.data)], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();

}

/* ---------- Tournament setup (organizer) + registration list (everyone) ---------- */
async function fetchJson(path) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
  try { const res = await fetch(DB_URL + path + '.json', { cache: 'no-store', signal: ctl.signal }); if (!res.ok) throw new Error('HTTP ' + res.status); return await res.json(); }
  finally { clearTimeout(t); }
}
function applySetup() {
  buildTournament(S.cfg);
  S.cfgJson = JSON.stringify(S.cfg);
  RESULTS_URL = DB_URL + '/' + TOURNAMENT.resultsPath;
  SUB_LINE = dateLong(TOURNAMENT.date) + ' \u00b7 round robin results';
  SCHED_SUB = '3 courts \u00b7 ' + ROUND_TIMES.length + ' rounds \u00b7 first match ' + (ROUND_TIMES[0] || '') + ' \u00b7 ' + dateLong(TOURNAMENT.date);
  S.data = { results: {}, shareUrl: '' }; S.filter = '';
}
async function loadSetup() {
  try { registerPlayers(await fetchJson('/tennis/players')); registerGenders(await fetchJson('/tennis/genders')); } catch (e) { /* offline: built-in names only */ }
  try { S.cfg = (await fetchJson('/tennis/setup')) || DEFAULT_CFG; } catch (e) { S.cfg = S.cfg || DEFAULT_CFG; }
}
async function pollSetup() {
  if (document.hidden || S.modal) return;
  try {
    const cfg = (await fetchJson('/tennis/setup')) || DEFAULT_CFG;
    if (JSON.stringify(cfg) !== S.cfgJson) { S.cfg = cfg; applySetup(); render(); pollResults(); }
  } catch (e) { /* keep what we have */ }

function bodyHtml() {
  if (S.tab === 'history') return historyView();
  const live = S.cfg && S.cfg.status === 'live';
  if (!live) return S.tab === 'sched' ? '<section class="card"><p class="foot" style="color:var(--ink)">The draw has not been published yet. Check the Men, Women and Mixed tabs to see who has registered and which spots are still open.</p></section>' : registrationView(S.tab === 'women' ? 'women' : S.tab === 'mixed' ? 'mixed' : 'men');
  if (!CATS.length) return '<section class="card"><p class="foot" style="color:var(--ink)">No groups could be built from the setup.</p></section>';
  return S.tab === 'sched' ? schedule() : standings(S.tab);
}
function restNote() {
  const sizes = [...new Set(CATS.filter(c => c.rests && c.format !== 'americano').map(c => c.size))];
  return sizes.length ? '<li>Rest order (round: draw number) \u2014 ' + sizes.map(n => 'groups of ' + n + ': ' + restOrder(n).map((p, r) => 'R' + (r + 1) + ': P' + p).join(', ')).join('; ') + '.</li>' : '';
}
function validScore(scoring, a, b) {
  if (!Number.isInteger(a) || !Number.isInteger(b)) return false;
  const hi = Math.max(a, b), lo = Math.min(a, b);
  return scoring === 'set' ? (hi === 6 && lo <= 4) || (hi === 7 && (lo === 5 || lo === 6)) : hi === 4 && lo >= 0 && lo <= 3;
}
const hasLeague = lg => (S.cfg && S.cfg.status === 'live') ? CATS.some(c => c.league === lg) : CAT_ORDER.some(k => CAT_DEFS[k][0] === lg && S.cfg && S.cfg.cats && S.cfg.cats[k] && !S.cfg.cats[k].off);
function registrationView(league) {
  const cfg = S.cfg || DEFAULT_CFG, cats = cfg.cats || {};

  const cards = CAT_ORDER.filter(k => CAT_DEFS[k][0] === league && cats[k] && !cats[k].off).map(k => {
    const c = catCfg(cats[k]), cap = c.groups * c.size, names = c.players, left = cap - names.length, dbl = c.format === 'doubles';
    const rows = Array.from({ length: cap }, (_, i) => (c.groups > 1 && i % c.size === 0 ? `<p class="gh2">Group ${i / c.size + 1}</p>` : '') + (names[i]
      ? `<div class="seat"><span>${(i % c.size) + 1}</span><span>${esc(names[i])}</span>${S.canEdit ? `<button class="rm" data-act="regdel" data-cat="${k}" data-i="${i}" aria-label="Remove ${esc(names[i])}">\u00d7</button>` : ''}</div>`

      : `<div class="seat open"><span>${(i % c.size) + 1}</span><span>${dbl ? 'Open spot for a pair' : 'Open spot'}</span></div>`)).join('');

function readDraft() {
  const d = S.modal.draft, q = f => $modal.querySelector('[data-f="' + f + '"]');
  if (q('month')) { d.month = q('month').value || d.month; d.name = q('name').value.trim() || 'Singles League'; d.start = q('start').value || d.start; d.roundMin = Math.max(10, +q('roundMin').value || 25); d.info = q('info').value.trim(); }

function setupBody(md) {
  const d = md.draft; let ngroups = 0, rounds = 0;
  const opt = (v, t, cur) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${t}</option>`;
  const blocks = CAT_ORDER.map(k => {
    const c = d.cats[k], on = !!c && !c.off;
    let h = `<div class="sc"><label class="scr"><input type="checkbox" data-f="on" data-cat="${k}" ${on ? 'checked' : ''}><b>${catTitle(k)}</b></label>`;
    if (on) {
      const cap = c.groups * c.size, dbl = c.format === 'doubles'; ngroups += c.groups; rounds += c.groups * roundsFor(c.format, c.size);
      h += `<div class="sf"><label>Format <select data-f="format" data-cat="${k}">${formatsFor(k).map(f => opt(f, FORMATS[f], c.format)).join('')}</select></label>
        <label>${dbl ? 'Pairs' : 'Players'} per group <select data-f="size" data-cat="${k}">${sizesFor(c.format).map(n => opt(n, n, c.size)).join('')}</select></label>
        <label>Groups <select data-f="groups" data-cat="${k}">${[1, 2, 3, 4].map(n => opt(n, n, c.groups)).join('')}</select></label>
        <label>Match <select data-f="scoring" data-cat="${k}">${opt('auto', 'Auto (' + scoringText(scoringFor(c)) + ')', c.scoring)}${opt('to4', 'First to 4 games', c.scoring)}${opt('set', 'Full set', c.scoring)}</select></label>
        <span class="cnt">${c.players.length} / ${cap} ${dbl ? 'pairs' : 'players'}</span></div>`;
    }
    return h + '</div>';
  }).join('');
  const [sh, sm] = String(d.start).split(':').map(Number);
  const radio = (v, t, s) => `<label class="scr"><input type="radio" name="st" data-f="status" value="${v}" ${d.status === v ? 'checked' : ''}><span><b>${t}</b><br><small>${s}</small></span></label>`;
  return `<p class="dmeta">Organizer</p><h3 id="dt">Tournament setup</h3>
  <div class="sf"><label>Name <input type="text" data-f="name" value="${esc(d.name)}"></label></div>
  <div class="sf"><label>Month <input type="month" data-f="month" value="${esc(d.month)}"></label><span class="cnt">${dateLong(firstSaturday(d.month))}</span></div>
  <div class="sf"><label>Start <input type="time" data-f="start" value="${esc(d.start)}"></label><label>Minutes per round <input type="number" data-f="roundMin" min="10" max="60" value="${d.roundMin}"></label></div>
  <div class="sf"><label style="flex:1">Note for players (optional) <input type="text" data-f="info" maxlength="160" style="width:100%" placeholder="e.g. Message the organizer to join" value="${esc(d.info || '')}"></label></div>
  <p class="hint">Choose the categories here. Add players afterwards from the Men, Women and Mixed tabs: tap an open spot.</p>
  ${blocks}
  <p class="sumr">${ngroups} group${ngroups === 1 ? '' : 's'} \u00b7 ${rounds} rounds \u00b7 3 courts${rounds ? ' \u00b7 ends about ' + fmt12((sh || 0) * 60 + (sm || 0) + rounds * d.roundMin) : ''}</p>
  <div class="sc">${radio('registration', 'Registration open', 'Everyone sees the players and open spots. No schedule yet.')}${radio('live', 'Publish draw', 'Builds the schedule and standings. Every group must be full.')}</div>
  <p class="err" role="alert">${esc(md.error)}</p>
  <div class="acts"><button class="btn pri" data-act="savesetup" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Saving\u2026' : 'Save'}</button><button class="btn txt" data-act="close">Cancel</button></div>`;
}
async function saveSetup() {
  readDraft(); const md = S.modal, d = md.draft, errs = [], act = CAT_ORDER.filter(k => d.cats[k] && !d.cats[k].off);
  act.forEach(k => { const c = d.cats[k], cap = c.groups * c.size, n = c.players.length, u = c.format === 'doubles' ? 'pairs' : 'players';
    if (n > cap) errs.push(catTitle(k) + ' has ' + n + ' ' + u + ' for ' + cap + ' places \u2014 remove some or raise the group size.');
    if (d.status === 'live' && n !== cap) errs.push(catTitle(k) + ' needs exactly ' + cap + ' ' + u + ' (has ' + n + ').'); });
  if (d.status === 'live' && !act.length) errs.push('Select at least one category.');
  if (errs.length) { md.error = errs.join(' '); renderModal(); return; }
  const prev = S.cfg;
  if (prev && prev.status === 'live' && prev.month !== d.month && Object.keys(S.data.results).length && !confirm('The current tournament has scores and will be replaced on the page. Archive it first if you have not. Continue?')) return;
  const cfg = { month: d.month, name: d.name, start: d.start, roundMin: d.roundMin, status: d.status, info: d.info || '', cats: d.cats };
  S.busy = true; renderModal();
  try {
    const res = await fetch(DB_URL + '/tennis/setup.json', { method: 'PUT', body: JSON.stringify(cfg) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    S.cfg = (await fetchJson('/tennis/setup').catch(() => null)) || cfg; applySetup();
    if (Object.keys(NEW_IDS).length) await fetch(DB_URL + '/tennis/players.json', { method: 'PATCH', body: JSON.stringify(NEW_IDS) });
    S.busy = false; S.modal = null; renderModal(); render(); pollResults(); toast('Saved \u2014 everyone sees the update');
  } catch (e) { S.busy = false; md.error = 'Could not save. Check your connection and the Firebase rules for tennis/setup.'; renderModal(); }
}

/* ---- picking players straight from the Men / Women / Mixed lists ---- */
const slotGender = (k, slot) => { const lg = CAT_DEFS[k][0]; return lg === 'men' ? 'm' : lg === 'women' ? 'f' : (slot === 1 ? 'm' : 'f'); };
function openPick(k) { S.modal = { type: 'pick', cat: k, slot: 1, first: '', q: '', error: '' }; renderModal(); }
function pickCandidates(md) {
  const g = slotGender(md.cat, md.slot), c = catCfg(((S.cfg || {}).cats || {})[md.cat] || {});
  const taken = c.players.flatMap(p => p.split(' / ').map(normName)).concat(md.first ? [normName(md.first)] : []);
  return Object.keys(PLAYERS).filter(id => id.indexOf('seat') !== 0 && id.indexOf('tm_') !== 0 && (!GENDER[id] || GENDER[id] === g) && !taken.includes(normName(PLAYERS[id]))).map(id => PLAYERS[id]).sort((a, b) => a.localeCompare(b));
}
function pickList(md) {
  const q = normName(md.q || ''), toks = q.split(' ').filter(Boolean), all = pickCandidates(md);
  const hit = all.filter(n => { const nn = normName(n); return toks.every(t => nn.includes(t)); });
  const row = (n, cls) => `<button class="prow ${cls || ''}" data-act="pickp" data-n="${esc(n)}">${esc(n)}</button>`;
  let h = hit.map(n => row(n)).join('');
  const typed = (md.q || '').trim().replace(/\s+/g, ' ');
  if (typed.length > 1 && !all.some(n => normName(n) === q)) {
    const sim = similarNames(typed).filter(n => all.includes(n) && !hit.includes(n)).slice(0, 3);
    if (sim.length) h += '<p class="hint">Similar names \u2014 is it one of these?</p>' + sim.map(n => row(n)).join('');
    h += `<button class="prow new" data-act="picknew" data-n="${esc(typed)}">+ Add \u201c${esc(typed)}\u201d as a new player</button>`;
  }
  return h || '<p class="hint">Nobody left to pick. Type a name to add a new player.</p>';
}
function pickBody(md) {
  const k = md.cat, c = catCfg(((S.cfg || {}).cats || {})[k] || {}), dbl = c.format === 'doubles', mixed = CAT_DEFS[k][0] === 'mixed';
  const title = dbl ? (mixed ? (md.slot === 1 ? 'Pick the man' : 'Now pick the woman') : (md.slot === 1 ? 'Pick player 1 of the pair' : 'Now pick player 2')) : 'Pick a player';
  return `<p class="dmeta">${catTitle(k)}${md.first ? ' \u00b7 with ' + esc(md.first) : ''}</p><h3 id="dt">${title}</h3>
  <input id="pq" class="sq" type="search" placeholder="Search or type a new name\u2026" autocomplete="off" autocapitalize="words" value="${esc(md.q)}">
  <div id="plist">${pickList(md)}</div><p class="err" role="alert">${esc(md.error)}</p>
  <div class="acts"><button class="btn txt" data-act="close">Cancel</button></div>`;
}
function pickAdvance(name) {
  const md = S.modal, k = md.cat, c = catCfg(((S.cfg || {}).cats || {})[k] || {});
  if (c.format === 'doubles' && !md.first) { md.first = name; md.q = ''; md.slot = 2; renderModal(); return; }
  commitEntry(k, c.format === 'doubles' ? [md.first, name] : [name]);
}
function pickNew(name) {
  const md = S.modal, id = lookupName(name);
  if (id) { if (pickCandidates(md).includes(PLAYERS[id])) pickAdvance(PLAYERS[id]); else { md.error = PLAYERS[id] + ' is already in this list.'; renderModal(); } return; }
  pickAdvance(name.replace(/(^|\s)\S/g, x => x.toUpperCase()));
}
async function savePlayers(k, arr) {
  const res = await fetch(DB_URL + '/tennis/setup/cats/' + k + '/players.json', { method: 'PUT', body: JSON.stringify(arr) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}
async function commitEntry(k, names) {
  const md = S.modal; S.busy = true;
  const ids = names.map((n, i) => ensurePlayer(n, slotGender(k, i + 1)));
  const newIds = { ...NEW_IDS }, newG = { ...NEW_GENDERS }, c = catCfg(((S.cfg || {}).cats || {})[k] || {});
  c.players.push(ids.map(i => PLAYERS[i]).join(' / '));
  try {
    await savePlayers(k, c.players);
    if (Object.keys(newIds).length) await fetch(DB_URL + '/tennis/players.json', { method: 'PATCH', body: JSON.stringify(newIds) });
    if (Object.keys(newG).length) { await fetch(DB_URL + '/tennis/genders.json', { method: 'PATCH', body: JSON.stringify(newG) }); Object.keys(newG).forEach(i => { delete NEW_GENDERS[i]; }); }
    S.cfg = (await fetchJson('/tennis/setup').catch(() => null)) || S.cfg; applySetup();
    S.busy = false; S.modal = null; renderModal(); render(); toast('Added to the list');
  } catch (e) { S.busy = false; md.error = 'Could not save. Check your connection and the Firebase rules.'; renderModal(); }
}
async function removeEntry(k, i) {
  const c = catCfg(((S.cfg || {}).cats || {})[k] || {}), name = c.players[i];
  if (!name || !confirm('Remove ' + name + ' from ' + catTitle(k) + '?')) return;
  c.players.splice(i, 1);
  try { await savePlayers(k, c.players); S.cfg = (await fetchJson('/tennis/setup').catch(() => null)) || S.cfg; applySetup(); render(); toast('Removed'); }
  catch (e) { toast('Could not remove. Check your connection.'); }
}
document.addEventListener('input', ev => {
  if (ev.target.id === 'pq' && S.modal && S.modal.type === 'pick') { S.modal.q = ev.target.value; const el = $modal.querySelector('#plist'); if (el) el.innerHTML = pickList(S.modal); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (S.modal && S.modal.type === 'setup' && t.dataset && t.dataset.f) { readDraft(); if (t.dataset.f !== 'info' && t.dataset.f !== 'name') renderModal(); }
});

/* ---------- Tournament history (archive + player records) ---------- */
function snapshot() {
  const st = S.data;
  return {
    id: TOURNAMENT.id, name: TOURNAMENT.name, date: TOURNAMENT.date, format: TOURNAMENT.format,
    archivedAt: new Date().toISOString(),
    players: PLAYERS,
    cats: CATS.map(c => ({
      key: c.key, league: c.league, label: c.label, format: c.format, scoring: c.scoring, complete: categoryProgress(st, c).complete,
      standings: rankCategory(st, c).map(s => ({ pid: s.pid, draw: s.draw, pos: s.pos, w: s.w, l: s.l, gw: s.gw, gl: s.gl }))
    })),
    results: st.results,
    rounds: Object.fromEntries(MATCHES.map(m => [m.id, m.round])),
    matches: MATCHES.map(m => ({ id: m.id, round: m.round, cat: m.cat, A: m.A, B: m.B }))
  };
}
async function archiveTournament() {
  const done = Object.keys(S.data.results).length, total = MATCHES.length;
  let msg = 'Archive "' + TOURNAMENT.name + '" (' + TOURNAMENT.date + ') to History? A frozen copy of the final classification is saved.';
  if (done < total) msg = 'Only ' + done + ' of ' + total + ' matches have a score. ' + msg;
  if (!confirm(msg)) return;
  try {
    const res = await fetch(HISTORY_URL + '/' + encodeURIComponent(TOURNAMENT.id) + '.json', { method: 'PUT', body: JSON.stringify(snapshot()) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    toast('Archived \u2014 see the History tab'); loadHistory();
  } catch (e) { toast('Could not archive. Check your connection and the Firebase rules for tennis/history.'); }
}
async function loadHistory() {
  try {
    const res = await fetch(HISTORY_URL + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    S.hist = (await res.json()) || {};
  } catch (e) { if (!S.hist) S.hist = {}; }
  if (S.tab === 'history' && !S.modal) render();
}
const fmtDate = iso => { const p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : esc(iso || ''); };
const catShort = c => leagueWord(c.league) + ' ' + String(c.label).replace('Category ', '');
const catFull = c => leagueTitle(c.league) + ' ' + c.label;
const evName = (ev, pid) => (ev.players && ev.players[pid]) || pid;
const nameHtml = n => { const p = String(n).split(' '); return `<span class="fn">${esc(p[0])}</span> <span class="ln">${esc(p.slice(1).join(' '))}</span>`; };

function historyView() {
  const seg = `<div class="tools"><div class="seg" role="group" aria-label="History view"><button data-act="hview" data-v="events" aria-pressed="${S.hview === 'events'}">Tournaments</button><button data-act="hview" data-v="players" aria-pressed="${S.hview === 'players'}">Records</button></div></div>`;
  if (S.hist === null) return seg + '<p class="foot">Loading history\u2026</p>';
  const evs = Object.values(S.hist).filter(e => e && e.cats).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!evs.length) return seg + `<section class="card"><p class="foot" style="color:var(--ink);opacity:.85">No archived tournaments yet.${S.canEdit ? ' When an event is finished, tap \u201cArchive tournament\u201d above.' : ''}</p></section>`;
  if (S.hview === 'players') return seg + playersView(evs);
  const sel = S.hsel && evs.find(e => e.id === S.hsel);
  if (sel) return eventView(sel);
  return seg + evs.map(ev => {
    const rows = ev.cats.map(c => { const st = c.standings || [], w = st[0], r2 = st[1];
      if (!w || !c.complete) return `<span class="hr"><small class="k">${catFull(c)}</small><strong>In progress</strong></span>`;
      return `<span class="hr"><small class="k">${catFull(c)}</small><strong>${esc(evName(ev, w.pid))}</strong>${r2 ? `<small class="r">Runner-up: ${esc(evName(ev, r2.pid))}</small>` : ''}</span>`; }).join('');
    return `<button class="hl" data-act="hsel" data-id="${esc(ev.id)}"><b>${esc(ev.name)}</b><em>${fmtDate(ev.date)}</em><span>${esc(ev.format || '')}</span><span class="hw">${rows}</span><span class="tap">Tap for full results</span></button>`;
  }).join('');
}
function eventView(ev) {
  const head = `<div class="tools"><button class="ghost" data-act="hback">\u2190 All tournaments</button></div><p class="foot"><b>${esc(ev.name)} \u00b7 ${fmtDate(ev.date)}</b><br>${esc(ev.format || '')}</p>`;
  return head + ev.cats.map(c => {
    const rows = (c.standings || []).map(s => `<tr><td class="pl"><span class="num">${s.draw}</span><span class="pname">${nameHtml(evName(ev, s.pid))}</span></td><td class="wl">${s.w}${dash}${s.l}</td><td class="gm"><b>${s.gw}</b><i>/</i><b>${s.gl}</b></td><td class="pos">${s.pos || dash}</td></tr>`).join('');
    return `<section class="card"><div class="card-head"><h2 class="tag">${catFull(c)}</h2><span class="pill ${c.complete ? 'final' : ''}"><i></i>${c.complete ? 'Final classification' : 'Incomplete when archived'}</span></div><div class="scroll"><table class="hist"><thead><tr><th class="l">PLAYER</th><th class="a2">W-L</th><th class="a2">GAMES<br>W-L</th><th class="pos">POS</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join('');
}
function playersView(evs) {
  const P = {};
  evs.forEach(ev => {
    const rd = ev.rounds || (ev.id === TOURNAMENT.id ? Object.fromEntries(MATCHES.map(m => [m.id, m.round])) : {});
    ev.cats.forEach(c => (c.standings || []).forEach(s => {
      const p = P[s.pid] = P[s.pid] || { pid: s.pid, name: evName(ev, s.pid), cat: c, pos: s.pos || 99, w: 0, l: 0, titles: 0, entries: [] };
      const mlist = ev.matches ? ev.matches.filter(m => m.cat === c.key) : Object.keys(ev.results || {}).filter(id => id.startsWith(c.key + '-')).map(id => { const [, a, b] = id.split('-'); return { id, A: [a], B: [b] }; });
      const ms = mlist.map(m => {
        const A = m.A || [], B = m.B || [], isA = A.indexOf(s.pid) >= 0; if (!isA && B.indexOf(s.pid) < 0) return null;
        const r = ev.results && ev.results[m.id]; if (!r) return null;
        const own = isA ? A : B, other = isA ? B : A;
        return { round: rd[m.id] || m.round || 99, opp: other.map(i => evName(ev, i)).join(' / '), with: own.length > 1 ? evName(ev, own.find(x => x !== s.pid)) : '', mine: isA ? r[0] : r[1], theirs: isA ? r[1] : r[0] };
      }).filter(Boolean).sort((x, y) => x.round - y.round);
      p.w += s.w || 0; p.l += s.l || 0; if (c.complete && s.pos === 1) p.titles++;
      p.entries.push({ ev, c, pos: s.pos, w: s.w, l: s.l, ms });
    }));
  });
  const all = Object.values(P), gk = c => ({ men: '0', women: '1', mixed: '2' })[c.league] + c.label;
  const groups = {};
  all.forEach(p => { (groups[gk(p.cat)] = groups[gk(p.cat)] || { cat: p.cat, list: [] }).list.push(p); });
  const keys = Object.keys(groups).sort();
  const sel = S.hplayer && P[S.hplayer] ? S.hplayer : '';
  const opts = '<option value="">All players</option>' + keys.map(k => `<optgroup label="${esc(catFull(groups[k].cat))}">${groups[k].list.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${esc(p.pid)}" ${p.pid === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('');
  const bar = `<div class="filter"><label for="hp">Find a player</label><select id="hp" data-act="hfilter">${opts}</select></div>`;
  const entry = e => `<div class="ph">${fmtDate(e.ev.date)} \u00b7 ${esc(e.ev.name)} \u00b7 ${catShort(e.c)}${e.pos ? ' \u00b7 #' + e.pos : ''} \u00b7 ${e.w}${dash}${e.l}</div>` +
    e.ms.map(m => `<div class="pm"><span>${m.round === 99 ? '' : 'R' + m.round}</span><span>${m.with ? 'w/ ' + esc(m.with) + ' \u00b7 ' : ''}vs ${esc(m.opp)}</span><b class="${m.mine > m.theirs ? 'w' : 'l'}">${m.mine > m.theirs ? 'W' : 'L'} ${m.mine}${dash}${m.theirs}</b></div>`).join('');
  const block = p => `<details class="pp" ${sel ? 'open' : 'open'}><summary><span class="pname">${esc(p.name)}</span><span class="pr">${p.w}${dash}${p.l}${p.titles ? ' \u00b7 ' + p.titles + (p.titles > 1 ? ' titles' : ' title') : ''}</span></summary>${p.entries.map(entry).join('')}</details>`;
  return bar + keys.map(k => {
    const list = groups[k].list.filter(p => !sel || p.pid === sel).sort((a, b) => a.pos - b.pos || a.name.localeCompare(b.name));
    return list.length ? `<section class="card"><div class="card-head"><h2 class="tag">${catFull(groups[k].cat)}</h2></div>${list.map(block).join('')}</section>` : '';
  }).join('');
}

/* ---------- Events ---------- */

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'scrim') { if (ev.target === el) closeModal(); return; }
  if (act === 'tab') { S.tab = el.dataset.tab; remember('lt-tab', S.tab); render(); window.scrollTo(0, 0); if (S.tab === 'history') loadHistory(); }
  else if (act === 'sort') { S.sort = el.dataset.sort; remember('lt-sort', S.sort); render(); }
  else if (act === 'match') openMatch(el.dataset.id);
  else if (act === 'share') openShare();
  else if (act === 'rules') openRules();
  else if (act === 'close') closeModal();
  else if (act === 'save') saveScore();
  else if (act === 'clear') clearScore();
  else if (act === 'pin') submitPin();
  else if (act === 'download') downloadFile();
  else if (act === 'archive') archiveTournament();
  else if (act === 'setup') openSetup();
  else if (act === 'regadd') openPick(el.dataset.cat);
  else if (act === 'regdel') removeEntry(el.dataset.cat, +el.dataset.i);
  else if (act === 'pickp') pickAdvance(el.dataset.n);
  else if (act === 'picknew') pickNew(el.dataset.n);
  else if (act === 'savesetup') saveSetup();
  else if (act === 'hsel') { S.hsel = el.dataset.id; render(); window.scrollTo(0, 0); }
  else if (act === 'hback') { S.hsel = null; render(); }
  else if (act === 'hview') { S.hview = el.dataset.v; S.hsel = null; render(); }
  else if (act === 'exitorg') exitOrganizer();
  else if (act === 'selecturl') el.select();
  else if (act === 'copy') {
    const done = () => toast('Link copied');
    try { navigator.clipboard.writeText(S.data.shareUrl || location.origin + location.pathname).then(done, () => { const i = $modal.querySelector('input.url'); if (i) { i.select(); } toast('Press Ctrl+C to copy'); }); }
    catch (e) { const i = $modal.querySelector('input.url'); if (i) i.select(); toast('Press Ctrl+C to copy'); }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset && ev.target.dataset.act === 'filter') { S.filter = ev.target.value; remember('lt-filter', S.filter); render(); const s = document.getElementById('pf'); if (s) s.focus(); }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset && ev.target.dataset.act === 'hfilter') { S.hplayer = ev.target.value; render(); const x = document.getElementById('hp'); if (x) x.focus(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.modal) closeModal();
  if (ev.key === 'Enter' && S.modal && ev.target.tagName === 'INPUT') { if (S.modal.type === 'match' && S.canEdit) saveScore(); else if (S.modal.type === 'pin') submitPin(); }
});

/* ---------- Boot ---------- */
$page.insertAdjacentHTML('beforebegin', RACKET_SYMBOL);
(async function boot() {
  try { if (localStorage.getItem('lt-org') === '1') S.canEdit = true; } catch (e) { /* ignore */ }
  const checkHash = () => { if (location.hash === '#organizer' && !S.canEdit) askPin(); };
  window.addEventListener('hashchange', checkHash);
  $page.innerHTML = '<p class="foot" style="padding:80px 0">Loading tournament\u2026</p>';
  await loadSetup(); applySetup(); if (S.tab === 'players') S.tab = 'men'; render(); checkHash();
  pollResults(); loadHistory();
  setInterval(pollResults, POLL_MS); setInterval(pollSetup, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollResults(); pollSetup(); } });
})();
</script></body></html>
