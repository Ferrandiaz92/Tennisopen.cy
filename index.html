<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tennis League — Results</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style id="css">:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#10283d; --bg2:#0a1c2c; --head:#10283d; --panel:#f4f0e4; --row:#ffffff; --row2:#ece8db;
  --ink:#10283d; --cream:#f6f1e3; --acc:#cfe93f; --acc-ink:#10283d; --acc2:#ff7f50;
  --muted:#7d8479; --line:#d9d3bf;
  --win:#1f6f3d; --winbg:#dcf0c8; --loss:#a93a2b; --lossbg:#f7dcd5;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
}
:root[data-theme="women"]{
  --bg:#5b1e4b; --bg2:#3c0f31; --head:#3f0f33; --panel:#fbf0e6; --row:#fffaf5; --row2:#f5e6da;
  --ink:#3f0f33; --cream:#fdf3ea; --acc:#f5c343; --acc-ink:#3f0f33; --acc2:#27b898;
  --muted:#8f7683; --line:#e8d3c2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg2);color:var(--cream);font-family:var(--font);
  -webkit-font-smoothing:antialiased;transition:background .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.wrap{padding:10px}
.frame{position:relative;overflow:hidden;max-width:1080px;margin:0 auto;background:var(--bg);
  border:6px solid #fbf6ea;border-radius:26px;padding:26px 22px 22px;transition:background .3s}
.deco{position:absolute;color:#fff;opacity:.05;pointer-events:none}
.deco.d1{width:340px;right:-70px;top:-40px;transform:rotate(28deg)}
.deco.d2{width:300px;left:-90px;bottom:60px;transform:rotate(-24deg)}
.frame>*:not(.deco){position:relative}

/* header */
.head{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,30px);text-align:center}
.head .racket{width:clamp(26px,5vw,44px);color:var(--acc);flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.head .racket.flip{transform:scaleX(-1)}
.kicker{margin:0;font-size:clamp(10px,2.2vw,13px);font-weight:700;letter-spacing:.32em;color:var(--acc);text-transform:uppercase}
.title{margin:2px 0 0;font-size:clamp(30px,7.4vw,56px);line-height:1.05;font-weight:800;letter-spacing:.01em;text-transform:uppercase;color:var(--cream)}
.title span{color:var(--acc)}
.sub{margin:6px 0 0;font-size:clamp(11px,2.6vw,14px);font-weight:400;color:rgba(246,241,227,.72)}

/* nav */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:20px 0 4px}
.tabs{display:inline-flex;background:rgba(0,0,0,.24);border-radius:999px;padding:4px;gap:2px;max-width:100%}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;color:rgba(246,241,227,.78);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);font-weight:700}
.tab:not([aria-selected="true"]):hover{color:#fff}
.ghost{border:2px solid rgba(246,241,227,.35);background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;font-size:13px;color:var(--cream)}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
.banner{margin:12px auto 0;max-width:560px;text-align:center;font-size:13px;font-weight:500;color:var(--acc-ink);background:var(--acc);border-radius:12px;padding:8px 14px}

/* cards */
.tools{display:flex;justify-content:flex-end;margin:14px 4px -6px}
.seg{display:inline-flex;background:rgba(0,0,0,.24);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;color:rgba(246,241,227,.75)}
.seg button[aria-pressed="true"]{background:rgba(246,241,227,.92);color:var(--ink)}
.card{background:var(--panel);color:var(--ink);border-radius:24px;padding:16px 14px 10px;margin:20px 0 0;box-shadow:0 7px 0 var(--bg2)}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 4px 6px}
.tag{margin:0;display:inline-block;background:var(--acc);color:var(--acc-ink);font-size:clamp(17px,4vw,22px);font-weight:800;padding:6px 22px;border-radius:999px;box-shadow:0 4px 0 var(--bg2)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);opacity:.8}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.pill.final{opacity:1;background:var(--ink);color:var(--acc);padding:5px 12px;border-radius:999px;font-weight:700}
.pill.final i{background:var(--acc)}

.scroll{overflow-x:auto;padding:0 2px 2px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:700px}
th{background:var(--head);color:#fff;font-size:11px;font-weight:700;letter-spacing:.07em;padding:10px 6px;text-align:center;line-height:1.15}
th.l{text-align:left;padding-left:16px;border-radius:12px 0 0 12px;position:sticky;left:0;z-index:2;background:var(--head)}
th.a2{color:var(--acc2)}
th.pos{background:var(--acc);color:var(--acc-ink);border-radius:0 12px 12px 0;position:sticky;right:0;z-index:2}
td{background:var(--row);padding:5px 4px;text-align:center;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr:nth-child(even) td{background:var(--row2)}
td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
td.m,td.wl,td.gm{border-left:1px dashed var(--line)}
td.pos{background:var(--acc)!important;border:0;border-radius:0 12px 12px 0;font-weight:800;font-size:22px;color:var(--acc-ink);width:64px;line-height:1;position:sticky;right:0;z-index:1}
td.pos small{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;margin-top:3px;opacity:.7}
td.pl{position:sticky;left:0;z-index:1;text-align:left;padding-left:12px;white-space:nowrap;min-width:196px}
tbody tr:nth-child(even) td.pl{background:var(--row2)}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--head);color:#fff;font-size:10px;font-weight:700;margin-right:8px;vertical-align:middle}
.pname{font-size:14px;font-weight:700;vertical-align:middle}
td.m{width:104px}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:46px;border:0;border-radius:10px;padding:4px 2px;background:transparent;line-height:1.15}
.mc b{font-size:15px;font-weight:700}
.mc span{font-size:10px;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc.win{background:var(--winbg);color:var(--win)}
.mc.loss{background:var(--lossbg);color:var(--loss)}
.mc.pend{color:var(--muted)}
.mc:hover{box-shadow:inset 0 0 0 2px var(--head)}
td.wl{font-weight:800;font-size:16px;width:70px}
td.gm{width:96px;font-weight:700;font-size:15px;white-space:nowrap}
td.gm i{font-style:normal;color:var(--acc2);font-weight:800;margin:0 4px}
.dim{color:var(--muted)}

.foot{margin:18px 6px 2px;text-align:center;font-size:12px;line-height:1.7;color:rgba(246,241,227,.65)}
.swipe{display:none;margin:0 6px 4px;font-size:11px;font-weight:500;color:var(--muted)}
.foot b{color:rgba(246,241,227,.9);font-weight:600}
.foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin:0 8px;vertical-align:middle}

/* schedule */
.filter{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;flex-wrap:wrap;font-size:13px;font-weight:500}
.filter select{background:rgba(0,0,0,.28);border:2px solid rgba(246,241,227,.3);border-radius:999px;padding:8px 14px;color:var(--cream);font-weight:600;max-width:100%}
.filter select option,.filter select optgroup{color:#10283d;background:#fff}
.round{display:grid;grid-template-columns:118px 1fr;gap:12px;background:var(--panel);color:var(--ink);border-radius:20px;padding:10px;margin-top:14px;box-shadow:0 6px 0 var(--bg2)}
.rt{background:var(--head);color:#fff;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.rt small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2)}
.rt strong{font-size:26px;line-height:1;font-weight:800;color:var(--acc)}
.rt em{font-style:normal;font-size:13px;font-weight:600}
.rt .next{margin-top:6px;background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px}
.courts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{border:1px solid var(--line);background:var(--row);border-radius:14px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.mt:hover{box-shadow:inset 0 0 0 2px var(--head)}
.mt-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.chip{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.men{background:#10283d;color:#cfe93f}
.chip.women{background:#5b1e4b;color:#f5c343}
.pl2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:500;line-height:1.3}
.pl2 .sc{font-weight:800;font-variant-numeric:tabular-nums}
.pl2.w{font-weight:800}
.pl2.w .sc{color:var(--win)}
.pl2.l{color:#5f665c}
.vs{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.empty{margin:18px 6px;text-align:center;color:rgba(246,241,227,.75);font-size:14px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,14,22,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--panel);color:var(--ink);border-radius:24px;padding:22px 22px 18px;width:100%;max-width:400px;box-shadow:0 8px 0 var(--bg2);max-height:100%;overflow:auto}
.dlg h3{margin:8px 0 2px;font-size:20px;font-weight:800}
.dmeta{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.dl-row{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;margin-top:12px}
.dl-row label,.dl-row .nm{font-size:15px;font-weight:700}
.dl-row input{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:center;font-size:24px;font-weight:800;color:var(--ink)}
.dl-row input:focus{border-color:var(--head);outline:none}
.dl-row .big{font-size:26px;font-weight:800;text-align:center}
.dl-row.w .nm{color:var(--win)}
.hint{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.err{color:var(--loss);font-size:13px;font-weight:600;margin:10px 0 0;min-height:1em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;background:var(--head);color:#fff}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:0 3px 0 var(--bg2)}
.btn.txt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.dng{background:transparent;color:var(--loss);border:2px solid var(--lossbg)}
.btn[disabled]{opacity:.55;cursor:default}
.qr{width:min(260px,70vw);margin:14px auto 8px;padding:10px;background:#fff;border-radius:16px;display:block}
.qr svg{display:block;width:100%;height:auto}
.dlg input.url{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fbf6ea;color:#10283d;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:60}

@media (max-width:760px){
  .wrap{padding:6px}
  .frame{padding:18px 8px 14px;border-width:5px;border-radius:22px}
  .card{padding:12px 6px 6px}
  .card-head{margin:0 4px 4px}
  .scroll{padding:0}
  table{min-width:0;border-spacing:0 4px}
  th{font-size:8.5px;padding:8px 1px;letter-spacing:.02em}
  th.l{padding-left:8px}
  td{padding:3px 1px}
  td.pl{min-width:0;width:88px;white-space:normal;padding-left:7px;line-height:1.1}
  .num{display:none}
  .pname{display:block}
  .pname .fn{display:block;font-size:9.5px;font-weight:500;color:var(--muted)}
  .pname .ln{font-size:11.5px;font-weight:800;letter-spacing:-.01em}
  td.m{width:35px}
  .mc{min-height:34px;padding:2px 0;border-radius:7px}
  .mc b{font-size:11px}
  .mc span{display:none}
  td.wl{font-size:12px;width:30px}
  td.gm{font-size:10.5px;width:44px}
  td.gm i{margin:0 1px}
  td.pos{font-size:17px;width:28px}
  td.pos small{display:none}
  .round{grid-template-columns:1fr}
  .rt{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px}
  .rt strong{font-size:20px}
  .rt .next{margin:0 0 auto auto}
  .courts{grid-template-columns:1fr}
  .tabs{width:100%}
  .tab{flex:1;padding:9px 6px;font-size:13px}
  .swipe{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.dl-row input[type=number]{-moz-appearance:textfield;appearance:textfield}
.dl-row input::-webkit-outer-spin-button,.dl-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.bacts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.bacts button{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px;background:var(--acc-ink);color:var(--acc)}
.bacts button:last-child{background:transparent;color:var(--acc-ink);border:2px solid var(--acc-ink)}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;font-size:12px;font-weight:600;color:rgba(246,241,227,.8);text-align:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#9aa7a0;flex:none}
.sync.ok i{background:#5fe08a;box-shadow:0 0 0 3px rgba(95,224,138,.25)}
.sync.bad{color:#ffb4a3}.sync.bad i{background:#ff7a5c}

.gh{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dlg{max-height:calc(100vh - 32px)}
.dlg.wide{max-width:660px}
.rules h4{margin:18px 0 6px;font-size:15px;font-weight:800;color:var(--ink);padding-bottom:4px;border-bottom:2px solid var(--acc)}
.rules ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}
.rules li{margin:3px 0}
.rules .ex{margin-top:14px;background:var(--row);border:1px solid var(--line);border-left:5px solid var(--acc2);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55}

.scrim{padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.dlg{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden;max-height:100%}
.dbody{overflow-y:auto;padding:22px 22px 18px;-webkit-overflow-scrolling:touch}
.dbody>.dmeta,.dbody>h3{padding-right:38px}
.x{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--head);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.x:hover{background:var(--acc2)}

.rules ol{margin:0;padding-left:22px;font-size:13.5px;line-height:1.55}
.rules ol li{margin:4px 0;padding-left:2px}
.rules ol li::marker{font-weight:800;color:var(--acc2)}
.rules .lead{margin:0 0 4px;font-size:13.5px;font-weight:600}
.rules ul+ul,.rules ol+ul{margin-top:8px}

  /**
   * @param unicodeData base64 string of byte array.

   * @param numChars

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

const PLAYERS = {
  shishorin: 'George Shishorin', colella: 'Adriano Colella', tuzze: 'Luigi Tuzze',
  loginidi: 'Mikhail Loginidi', chadunin: 'Dmitry Chadunin',
  liakishev: 'Nikolai Liakishev', metnev: 'Vladislav Metnev', kozlov: 'Bogdan Kozlov',
  martinez: 'Luis Martinez', kolesnyk: 'Oleksandr Kolesnyk', kouloundis: 'Demetris Kouloundis',
  shishorina: 'Violetta Shishorina', bodrikova: 'Irina Bodrikova', christodoulou: 'Eliza Christodoulou',
  gaponova: 'Anna Gaponova', azi: 'Elena Azi', guseva: 'Lena Guseva',
  lopatina: 'Mary Lopatina', gruzinova: 'Aleksandra Gruzinova', reiman: 'Irina Reiman',
  andreeva: 'Anna Andreeva', solyanik: 'Daria Solyanik'
};

const CATS = [
  { key: 'MA', league: 'men',   label: 'Category A', players: ['shishorin', 'colella', 'tuzze', 'loginidi', 'chadunin'] },
  { key: 'MB', league: 'men',   label: 'Category B', players: ['liakishev', 'metnev', 'kozlov', 'martinez', 'kolesnyk', 'kouloundis'] },
  { key: 'WA', league: 'women', label: 'Category A', players: ['shishorina', 'bodrikova', 'christodoulou', 'gaponova', 'azi', 'guseva'] },
  { key: 'WB', league: 'women', label: 'Category B', players: ['lopatina', 'gruzinova', 'reiman', 'andreeva', 'solyanik'] }
];

const ROUND_TIMES = ['4:00pm', '4:25pm', '4:50pm', '5:15pm', '5:40pm', '6:10pm', '6:35pm', '7:00pm',
  '7:25pm', '7:50pm', '8:10pm', '8:35pm', '9:00pm', '9:25pm', '9:50pm'];

// [round, court, category, player A, player B]
const RAW = [
  [1, 1, 'WA', 'shishorina', 'gaponova'], [1, 2, 'WB', 'reiman', 'solyanik'], [1, 3, 'MB', 'kozlov', 'kolesnyk'],
  [2, 1, 'MA', 'tuzze', 'colella'], [2, 2, 'WA', 'christodoulou', 'azi'], [2, 3, 'MB', 'martinez', 'kouloundis'],
  [3, 1, 'MB', 'metnev', 'liakishev'], [3, 2, 'MA', 'shishorin', 'chadunin'], [3, 3, 'WA', 'bodrikova', 'guseva'],
  [4, 1, 'WA', 'christodoulou', 'shishorina'], [4, 2, 'WB', 'gruzinova', 'solyanik'], [4, 3, 'WB', 'lopatina', 'andreeva'],
  [5, 1, 'MB', 'metnev', 'kozlov'], [5, 2, 'MA', 'loginidi', 'colella'], [5, 3, 'MB', 'martinez', 'kolesnyk'],
  [6, 1, 'WA', 'bodrikova', 'gaponova'], [6, 2, 'WA', 'azi', 'guseva'], [6, 3, 'WB', 'reiman', 'andreeva'],
  [7, 1, 'MA', 'tuzze', 'chadunin'], [7, 2, 'MB', 'metnev', 'kouloundis'], [7, 3, 'WB', 'lopatina', 'solyanik'],
  [8, 1, 'MB', 'martinez', 'liakishev'], [8, 2, 'MA', 'loginidi', 'shishorin'], [8, 3, 'WA', 'azi', 'shishorina'],
  [9, 1, 'WA', 'christodoulou', 'bodrikova'], [9, 2, 'WB', 'reiman', 'lopatina'], [9, 3, 'WB', 'gruzinova', 'andreeva'],
  [10, 1, 'MB', 'kozlov', 'liakishev'], [10, 2, 'MA', 'chadunin', 'colella'], [10, 3, 'MB', 'kolesnyk', 'kouloundis'],
  [11, 1, 'WA', 'azi', 'gaponova'], [11, 2, 'WA', 'christodoulou', 'guseva'], [11, 3, 'WB', 'gruzinova', 'reiman'],
  [12, 1, 'MA', 'tuzze', 'shishorin'], [12, 2, 'MB', 'metnev', 'martinez'], [12, 3, 'MA', 'chadunin', 'loginidi'],
  [13, 1, 'MB', 'kolesnyk', 'liakishev'], [13, 2, 'WB', 'solyanik', 'andreeva'], [13, 3, 'MB', 'kozlov', 'kouloundis'],
  [14, 1, 'WA', 'bodrikova', 'shishorina'], [14, 2, 'WB', 'gruzinova', 'lopatina'], [14, 3, 'WA', 'guseva', 'gaponova'],
  [15, 1, 'MA', 'tuzze', 'loginidi'], [15, 2, 'MA', 'shishorin', 'colella']

const MATCHES = RAW.map(([round, court, cat, a, b]) => ({ id: cat + '-' + a + '-' + b, round, court, cat, a, b }));
const CAT_BY_KEY = Object.fromEntries(CATS.map(c => [c.key, c]));
const lastName = id => PLAYERS[id].split(' ').slice(-1)[0];

/* ---------- Results helpers ---------- */
// state.results: { [matchId]: [gamesA, gamesB] }
function getResult(state, m) {
  const r = state.results && state.results[m.id];
  return r && Number.isInteger(r[0]) && Number.isInteger(r[1]) ? r : null;
}

function catMatches(catKey) { return MATCHES.filter(m => m.cat === catKey); }

function playerMatches(state, catKey, pid) {
  return catMatches(catKey)
    .filter(m => m.a === pid || m.b === pid)
    .sort((x, y) => x.round - y.round)
    .map(m => {
      const r = getResult(state, m);
      const isA = m.a === pid;
      const mine = r ? (isA ? r[0] : r[1]) : null;
      const theirs = r ? (isA ? r[1] : r[0]) : null;
      return { match: m, opp: isA ? m.b : m.a, mine, theirs, won: r ? mine > theirs : null };
    });
}

/* ---------- Standings ---------- */
function computeStats(state, cat) {
  return cat.players.map((pid, idx) => {
    const ms = playerMatches(state, cat.key, pid);
    let w = 0, l = 0, gw = 0, gl = 0, played = 0;
    ms.forEach(x => {
      if (x.won === null) return;
      played++; gw += x.mine; gl += x.theirs;
      if (x.won) w++; else l++;
    });
    return { pid, draw: idx + 1, matches: ms, w, l, gw, gl, gd: gw - gl, played, pos: null, tb: null };
  });
}

function headToHead(state, catKey, p, q) {
  const m = catMatches(catKey).find(x => (x.a === p && x.b === q) || (x.a === q && x.b === p));
  if (!m) return 0;
  const r = getResult(state, m);
  if (!r) return 0;
  const pGames = m.a === p ? r[0] : r[1];
  const qGames = m.a === p ? r[1] : r[0];
  return pGames > qGames ? 1 : pGames < qGames ? -1 : 0; // 1 => p ahead
}

// Order by wins; ties: 2 players => head-to-head, 3+ players => games differential
function rankCategory(state, cat) {
  const stats = computeStats(state, cat);
  const byWins = {};
  stats.forEach(s => { (byWins[s.w] = byWins[s.w] || []).push(s); });
  const ordered = [];
  Object.keys(byWins).map(Number).sort((a, b) => b - a).forEach(w => {
    let g = byWins[w];
    if (g.length === 2) {
      const h = headToHead(state, cat.key, g[0].pid, g[1].pid);
      if (h !== 0) {
        g = h > 0 ? [g[0], g[1]] : [g[1], g[0]];
        g[0].tb = 'H2H'; g[1].tb = 'H2H';
      } else {
        g = g.slice().sort((a, b) => b.gd - a.gd || b.gw - a.gw || a.draw - b.draw);
        if (g[0].gd !== g[1].gd) { g[0].tb = 'GD'; g[1].tb = 'GD'; }
      }
    } else if (g.length > 2) {
      g = g.slice().sort((a, b) => b.gd - a.gd || b.gw - a.gw || a.draw - b.draw);
      g.forEach(s => { s.tb = 'GD'; });
    }
    ordered.push(...g);
  });
  // positions (shared position only if completely level)
  ordered.forEach((s, i) => {
    if (s.played === 0) { s.pos = null; return; }
    const prev = ordered[i - 1];
    const level = prev && prev.w === s.w && prev.gd === s.gd && prev.gw === s.gw && prev.tb === null && s.tb === null;
    s.pos = level && prev.pos ? prev.pos : i + 1;
  });
  return ordered;
}

function categoryProgress(state, cat) {
  const ms = catMatches(cat.key);
  const done = ms.filter(m => getResult(state, m)).length;
  return { done, total: ms.length, complete: done === ms.length };
}

if (typeof module !== 'undefined') {
  module.exports = { PLAYERS, CATS, MATCHES, ROUND_TIMES, rankCategory, computeStats, categoryProgress, playerMatches, getResult, lastName, catMatches };
}

function standings(league) {
  const cats = CATS.filter(c => c.league === league);
  const tools = `<div class="tools"><div class="seg" role="group" aria-label="Sort players"><button data-act="sort" data-sort="pos" aria-pressed="${S.sort === 'pos'}">By position</button><button data-act="sort" data-sort="draw" aria-pressed="${S.sort === 'draw'}">Draw order</button></div></div>`;
  const skip = cats.filter(c => c.players.length === 6).map(c => `<br><b>${c.label}: Round 5 is not played \u2014 P1 vs P6 \u00b7 P2 vs P5 \u00b7 P3 vs P4</b>`).join('');
  const foot = `<p class="foot"><b>Each player plays 4 matches.</b> W${'\u2011'}L adds up wins and losses; Games W${'\u2011'}L adds up games won and lost.<br>Tie\u2011breaker (2 players): head\u2011to\u2011head winner ranks higher <span class="dot"></span> Tie\u2011breaker (3+ players): best games differential (GW${'\u2011'}GL) ranks higher<br>Tap any match for details.${skip}</p>`;
  return tools + cats.map(catCard).join('') + foot;
}

/* ---------- Order of play ---------- */
function playerOptions() {
  const groups = [['men', "Men\u2019s league"], ['women', "Women\u2019s league"]];
  return groups.map(([lg, name]) => `<optgroup label="${name}">${CATS.filter(c => c.league === lg).flatMap(c =>
    c.players.map(p => `<option value="${p}" ${S.filter === p ? 'selected' : ''}>${esc(PLAYERS[p])} (${c.label.replace('Category ', 'Cat ')})</option>`)).join('')}</optgroup>`).join('');
}

function matchCard(m) {
  const r = getResult(S.data, m);
  const cat = CAT_BY_KEY[m.cat];
  const lg = cat.league;
  const line = (pid, own, other) => {
    const cls = r ? (own > other ? 'w' : 'l') : '';
    return `<div class="pl2 ${cls}"><span>${esc(PLAYERS[pid])}</span><span class="sc">${r ? own : ''}</span></div>`;
  };
  const aria = `Court ${m.court}, ${PLAYERS[m.a]} versus ${PLAYERS[m.b]}` + (r ? `, ${r[0]} to ${r[1]}` : '');
  return `<button class="mt" data-act="match" data-id="${esc(m.id)}" aria-label="${esc(aria)}">
    <div class="mt-top"><span>Court ${m.court}</span><span class="chip ${lg}">${lg === 'men' ? 'Men' : 'Women'} \u00b7 ${cat.label.replace('Category ', 'Cat ')}</span></div>
    ${line(m.a, r && r[0], r && r[1])}<span class="vs">VS</span>${line(m.b, r && r[1], r && r[0])}</button>`;
}

function schedule() {
  const first = ROUND_TIMES.findIndex((_, i) => MATCHES.some(m => m.round === i + 1 && !getResult(S.data, m)));
  const rounds = ROUND_TIMES.map((time, i) => {
    let ms = MATCHES.filter(m => m.round === i + 1);
    if (S.filter) ms = ms.filter(m => m.a === S.filter || m.b === S.filter);
    if (!ms.length) return '';
    const next = i === first ? '<span class="next">Up next</span>' : '';
    return `<section class="round" aria-label="Round ${i + 1}"><div class="rt"><small>Round</small><strong>${i + 1}</strong><em>${time}</em>${next}</div><div class="courts">${ms.map(matchCard).join('')}</div></section>`;
  }).join('');
  const filter = `<div class="filter"><label for="pf">Find my matches</label><select id="pf" data-act="filter"><option value="">All players</option>${playerOptions()}</select></div>`;
  const done = MATCHES.filter(m => getResult(S.data, m)).length;
  return filter + `<p class="empty">${done} of ${MATCHES.length} matches played${first === -1 ? ' \u2014 the tournament is complete' : ''}</p>` + rounds;
}

/* ---------- Page render ---------- */
function render() {
  document.documentElement.dataset.theme = S.tab === 'women' ? 'women' : 'men';
  const deco = `<svg class="deco d1" viewBox="0 0 40 84" aria-hidden="true"><use href="#racket"/></svg><svg class="deco d2" viewBox="0 0 40 84" aria-hidden="true"><use href="#racket"/></svg>`;
  $page.innerHTML = `<div class="wrap"><div class="frame">${deco}${header()}${nav()}${S.tab === 'sched' ? schedule() : standings(S.tab)}</div></div>`;
}

/* ---------- Modals ---------- */
const RULES_HTML = `
<p class="dmeta">Tournament rules</p><h3 id="dt">Format &amp; rules</h3>
<div class="rules">
<h4>Tournament format</h4>
<ul>
<li>Singles tournament. Group stage, round robin.</li>
<li>4 levels: 2 men\u2019s levels and 2 women\u2019s levels (Category A and Category B).</li>
<li>5 or 6 players per group. Each player plays 4 matches against players in their group.</li>
<li>1st place in each group is the winner.</li>
<li><b>Groups of 6</b> (Men\u2019s Category B and Women\u2019s Category A): a full round robin would be 5 matches, so <b>Round 5 is not played</b> (P1 vs P6, P2 vs P5, P3 vs P4). This way everyone plays exactly 4 matches. P1\u2013P6 are the draw numbers shown next to each name.</li>
</ul>
<h4>Match format</h4>
<ul>
<li>Best of 1 set, first to 4 games (4\u20130, 4\u20131, 4\u20132 or 4\u20133). No tie\u2011breaks.</li>
<li><b>Golden point</b> at 40\u201340 (deuce): no advantage. The next point wins the game, and the receiver chooses which side to receive on.</li>
<li>Report your final score to the organizer straight after the match.</li>
</ul>
<h4>Basic rules</h4>
<ul>
<li><b>Scoring a game:</b> 0 (love), 15, 30, 40, game. At 40\u201340 play the golden point.</li>
<li><b>Serve:</b> the server has two serves and alternates every game. A serve that clips the net and lands in the right box is a let: replay the serve.</li>
<li><b>Ball in or out:</b> a ball touching the line is in. You make the calls on your side of the net. If you are not sure, the ball is good.</li>
<li><b>Point lost</b> if the ball bounces twice, you hit it before it crosses the net, you touch the net, or you hit the ball twice.</li>
<li><b>Ball from another court:</b> if a ball lands on your court during a point, call \u201clet\u201d. The point is replayed and the server has 2 serves.</li>
<li><b>Change ends</b> after every odd game (1st, 3rd, 5th). The server says the score out loud before each point, their own score first.</li>
<li><b>Fair play:</b> stay quiet during points and shake hands at the end. If the organizer cannot see where the ball landed and the two players do not agree, the point is replayed.</li>
</ul>
<h4>How positions are decided</h4>
<p class="lead">Positions are decided in this order:</p>
<ol>
<li><b>Number of wins</b> (W\u2011L): more wins rank higher.</li>
<li><b>Head\u2011to\u2011head:</b> if two players are tied on wins, the winner of the match between them ranks higher.</li>
<li><b>Games differential</b> (GW\u2011GL, games won minus games lost): if three or more players are tied on wins, the best differential ranks higher. Head\u2011to\u2011head is not used in that case.</li>
</ol>
<ul>
<li>The POS column shows <b>H2H</b> or <b>GD</b> under the number when a tie\u2011break decided the position.</li>
<li>If players are still level after the tie\u2011breaks, the organizers decide.</li>
</ul>
<div class="ex"><b>Example:</b> Player 2 and Player 3 both finish with 2 wins and 2 losses, so they are tied for 2nd. It is a two\u2011player tie, so head\u2011to\u2011head decides. If Player 2 beat Player 3, Player 2 takes 2nd and Player 3 takes 3rd, even if Player 3 has the better games differential (for example +5 against +4).<br><br>If Players 2, 3 and 4 all finish on 2 wins, it is a three\u2011player tie. Then only the games differential counts, so the player with the best GW\u2011GL takes 2nd.</div>
</div>
<div class="acts"><button class="btn pri" data-act="close">Got it</button></div>`;

function openMatch(id) { S.modal = { type: 'match', id, error: '' }; renderModal(); }
function openRules() { S.modal = { type: 'rules', error: '' }; renderModal(); }
function openShare() { S.modal = { type: 'share', error: '' }; renderModal(); }
function closeModal() { S.modal = null; renderModal(); }

function renderModal() {
  const md = S.modal;
  if (!md) { $modal.innerHTML = ''; return; }
  let body = '';
  if (md.type === 'rules') {
    body = RULES_HTML;
  } else if (md.type === 'pin') {
    body = `<p class="dmeta">Organizer</p><h3 id="dt">Enter your PIN</h3>
      <div class="dl-row"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Organizer PIN"></div>
      <p class="err" role="alert">${esc(md.error)}</p><div class="acts"><button class="btn pri" data-act="pin">Unlock</button><button class="btn txt" data-act="close">Cancel</button></div>`;
  } else if (md.type === 'match') {
    const m = matchById(md.id); const r = getResult(S.data, m); const cat = CAT_BY_KEY[m.cat];
    const meta = `Round ${m.round} \u00b7 ${ROUND_TIMES[m.round - 1]} \u00b7 Court ${m.court}`;
    const title = `${cat.league === 'men' ? "Men\u2019s" : "Women\u2019s"} ${cat.label}`;
    let rows, acts;
    if (S.canEdit) {
      rows = `<div class="dl-row"><label for="sa">${esc(PLAYERS[m.a])}</label><input id="sa" type="number" inputmode="numeric" min="0" max="4" value="${r ? r[0] : ''}" aria-label="Games won by ${esc(PLAYERS[m.a])}"></div>
              <div class="dl-row"><label for="sb">${esc(PLAYERS[m.b])}</label><input id="sb" type="number" inputmode="numeric" min="0" max="4" value="${r ? r[1] : ''}" aria-label="Games won by ${esc(PLAYERS[m.b])}"></div>
              <p class="hint">Enter the games won by each player. First to 4 games wins (4\u20130, 4\u20131, 4\u20132, 4\u20133).</p>`;
      acts = `<button class="btn pri" data-act="save" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Saving\u2026' : 'Save score'}</button>
              ${r ? '<button class="btn dng" data-act="clear">Clear score</button>' : ''}<button class="btn txt" data-act="close">Cancel</button>`;
    } else {
      const wA = r && r[0] > r[1], wB = r && r[1] > r[0];
      rows = r ? `<div class="dl-row ${wA ? 'w' : ''}"><span class="nm">${esc(PLAYERS[m.a])}</span><span class="big">${r[0]}</span></div>
                  <div class="dl-row ${wB ? 'w' : ''}"><span class="nm">${esc(PLAYERS[m.b])}</span><span class="big">${r[1]}</span></div>`
        : `<div class="dl-row"><span class="nm">${esc(PLAYERS[m.a])}</span><span class="dim">vs</span></div><div class="dl-row"><span class="nm">${esc(PLAYERS[m.b])}</span><span class="dim"></span></div><p class="hint">Not played yet.</p>`;
      acts = '<button class="btn" data-act="close">Close</button>';
    }
    body = `<p class="dmeta">${meta}</p><h3 id="dt">${title}</h3>${rows}<p class="err" role="alert">${esc(md.error)}</p><div class="acts">${acts}</div>`;
  } else {
    const url = S.data.shareUrl || (location.protocol.startsWith('http') ? location.origin + location.pathname : '');
    let qr = '';
    if (url) { try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = `<div class="qr">${q.createSvgTag({ cellSize: 6, margin: 2, scalable: true, alt: 'QR code linking to the tournament results' })}</div>`; } catch (e) { qr = ''; } }
    body = `<p class="dmeta">Share with players</p><h3 id="dt">Scan to follow the results</h3>
      ${qr || '<p class="hint">No link has been added yet.</p>'}
      ${url && (!S.canEdit || STANDALONE) ? `<input class="url" readonly value="${esc(url)}" aria-label="Tournament link" data-act="selecturl">` : ''}
      ${S.canEdit && !STANDALONE ? `<p class="hint">${url ? 'Change the link' : 'Paste the public link to this page'} to update the QR code.</p><input class="url" id="newurl" type="url" placeholder="https://\u2026" value="${esc(url)}" aria-label="Public link">` : ''}
      <p class="err" role="alert">${esc(md.error)}</p>
      <div class="acts">${url ? '<button class="btn pri" data-act="copy">Copy link</button>' : ''}${S.canEdit && !STANDALONE ? `<button class="btn" data-act="saveurl" ${S.busy ? 'disabled' : ''}>Save link</button>` : ''}<button class="btn txt" data-act="close">Close</button></div>`;
  }
  $modal.innerHTML = `<div class="scrim" data-act="scrim"><div class="dlg${md.type === 'rules' ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dt"><button class="x" data-act="close" aria-label="Close">\u00d7</button><div class="dbody">${body}</div></div></div>`;
  if (md.type === 'rules') { const d = $modal.querySelector('.dlg'); d.setAttribute('tabindex', '-1'); d.focus({ preventScroll: true }); $modal.querySelector('.dbody').scrollTop = 0; return; }
  const first = $modal.querySelector('input:not([readonly])') || $modal.querySelector('button');
  if (first) first.focus();
}

let toastTimer;
function toast(msg) {
  $toast.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $toast.innerHTML = ''; }, 3200);
}

/* ---------- Publishing (organizer only) ---------- */
function buildDoc(state) {
  const g = id => document.getElementById(id).textContent;
  const T = 'scr' + 'ipt';
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
    '<title>Tennis League \u2014 Results</title>' +
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">' +
    '<style id="css">' + g('css') + '</style></head><body>' +
    '<div id="page"></div><div id="modal"></div><div id="toast" aria-live="polite"></div>' +
    '<' + T + ' type="application/json" id="state">' + JSON.stringify(state).replace(/</g, '\\u003c') + '</' + T + '>' +
    '<' + T + ' id="qrlib">' + g('qrlib') + '</' + T + '>' +
    '<' + T + ' id="logic">' + g('logic') + '</' + T + '>' +
    '<' + T + ' id="app">' + g('app') + '</' + T + '></body></html>';
}

async function persist(next, matchId) {
  // Writes one match to the shared database, then shows it immediately.
  S.busy = true; renderModal();
  try {
    const url = `${RESULTS_URL}/${encodeURIComponent(matchId)}.json`;
    const res = next.results[matchId]
      ? await fetch(url, { method: 'PUT', body: JSON.stringify(next.results[matchId]) })
      : await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    S.data = next; S.busy = false; S.modal = null;
    S.sync = { status: 'live', at: clock() };
    renderModal(); render(); toast('Saved \u2014 standings updated for everyone');
  } catch (e) {
    S.busy = false;
    if (S.modal) S.modal.error = 'Could not save. Check your connection and press Save again.';
    renderModal();
  }
}

const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

async function pollResults() {
  if (document.hidden || S.busy || S.modal) return;
  try {
    const res = await fetch(RESULTS_URL + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = (await res.json()) || {};
    const clean = {};
    Object.keys(remote).forEach(k => { const v = remote[k]; if (Array.isArray(v) && Number.isInteger(v[0]) && Number.isInteger(v[1])) clean[k] = v; });
    const changed = JSON.stringify(clean) !== JSON.stringify(S.data.results) || S.sync.status !== 'live';
    S.data = { ...S.data, results: clean };
    S.sync = { status: 'live', at: clock() }; S.fails = 0;
    if (changed) render(); else { const el = document.querySelector('.sync'); if (el) el.outerHTML = syncBar(); }
  } catch (e) {
    S.fails = (S.fails || 0) + 1;
    if (S.fails < 2) return; // ignore a single blip
    S.sync = { status: 'offline', at: S.sync.at };
    const el = document.querySelector('.sync'); if (el) el.outerHTML = syncBar();
  }
}

function saveScore() {
  const m = matchById(S.modal.id);
  const a = document.getElementById('sa').value.trim(), b = document.getElementById('sb').value.trim();
  const fail = t => { S.modal.error = t; renderModal(); const el = document.getElementById('sa'); };
  if (a === '' || b === '') return fail('Enter games won for both players.');
  const na = Number(a), nb = Number(b);
  const hi = Math.max(na, nb), lo = Math.min(na, nb);
  if (!Number.isInteger(na) || !Number.isInteger(nb) || hi !== 4 || lo < 0 || lo > 3) return fail('The match is first to 4 games. Valid scores: 4\u20130, 4\u20131, 4\u20132 or 4\u20133.');
  persist({ ...S.data, results: { ...S.data.results, [m.id]: [na, nb] } }, m.id);
}

function clearScore() {
  const res = { ...S.data.results }; delete res[S.modal.id];
  persist({ ...S.data, results: res }, S.modal.id);
}

function saveUrl() {
  const v = (document.getElementById('newurl').value || '').trim();
  if (v && !/^https?:\/\//i.test(v)) { S.modal.error = 'Enter a full link starting with https://'; renderModal(); return; }
  S.modal.error = '';
}

function downloadFile() {
  const blob = new Blob([buildDoc(S.data)], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Downloaded. Upload it to your host to show players the latest scores.');
}
function exitOrganizer() {
  try { localStorage.removeItem('lt-org'); } catch (e) { /* ignore */ }
  S.canEdit = false; history.replaceState(null, '', location.pathname + location.search); render();
  toast('Organizer mode locked. Scores are safe in the database.');
}

function askPin() {
  S.modal = { type: 'pin', error: '' }; renderModal();
}
function submitPin() {
  const v = (document.getElementById('pin').value || '').trim();
  if (v !== ORG_PIN) { S.modal.error = 'Wrong PIN. Try again.'; renderModal(); return; }
  try { localStorage.setItem('lt-org', '1'); } catch (e) { /* ignore */ }
  S.canEdit = true; S.modal = null; renderModal(); render();
  history.replaceState(null, '', location.pathname + location.search);
  toast('Organizer mode unlocked');
}

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'scrim') { if (ev.target === el) closeModal(); return; }
  if (act === 'tab') { S.tab = el.dataset.tab; remember('lt-tab', S.tab); render(); window.scrollTo(0, 0); }
  else if (act === 'sort') { S.sort = el.dataset.sort; remember('lt-sort', S.sort); render(); }
  else if (act === 'match') openMatch(el.dataset.id);
  else if (act === 'share') openShare();
  else if (act === 'rules') openRules();
  else if (act === 'close') closeModal();
  else if (act === 'save') saveScore();
  else if (act === 'clear') clearScore();
  else if (act === 'pin') submitPin();
  else if (act === 'download') downloadFile();
  else if (act === 'exitorg') exitOrganizer();
  else if (act === 'selecturl') el.select();
  else if (act === 'copy') {
    const done = () => toast('Link copied');
    try { navigator.clipboard.writeText(S.data.shareUrl || location.origin + location.pathname).then(done, () => { const i = $modal.querySelector('input.url'); if (i) { i.select(); } toast('Press Ctrl+C to copy'); }); }
    catch (e) { const i = $modal.querySelector('input.url'); if (i) i.select(); toast('Press Ctrl+C to copy'); }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset && ev.target.dataset.act === 'filter') { S.filter = ev.target.value; remember('lt-filter', S.filter); render(); const s = document.getElementById('pf'); if (s) s.focus(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.modal) closeModal();
  if (ev.key === 'Enter' && S.modal && ev.target.tagName === 'INPUT') { if (S.modal.type === 'match' && S.canEdit) saveScore(); else if (S.modal.type === 'pin') submitPin(); }
});

/* ---------- Boot ---------- */
$page.insertAdjacentHTML('beforebegin', RACKET_SYMBOL);
(function boot() {
  try { if (localStorage.getItem('lt-org') === '1') S.canEdit = true; } catch (e) { /* ignore */ }
  const checkHash = () => { if (location.hash === '#organizer' && !S.canEdit) askPin(); };
  window.addEventListener('hashchange', checkHash);
  render(); checkHash();
  pollResults();
  setInterval(pollResults, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollResults(); });
})();
</script></body></html>
